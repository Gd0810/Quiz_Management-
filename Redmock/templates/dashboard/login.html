
{% extends "base.html" %}
{% load static %}
{% block title %}Dashboard Login | Redmock{% endblock %}

{% block content %}

<div id="dashboard-page-content" class="rc-login-wrap">

    <section class="rc-login-card">

        <!-- LEFT PANEL — replace the <img> below with your own illustration -->
        <div class="rc-login-left">
            <div class="rc-diagonal-shape"></div>

            <span class="rc-welcome-text">Welcome</span>

            <p class="rc-left-caption">Introducing Quiz & Mock Test Management System</p>
            <img src="{% static 'img/login.png' %}" alt="Illustration" class="rc-illustration-img">
        </div>

        <!-- RIGHT PANEL — login form -->
        <div class="rc-login-right">
            <div class="rc-form-wrap">
                <h1 class="rc-login-title"> Sign In </h1>

                {% if error %}
                    <div class="rc-error-box">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post" class="rc-login-form">
                    {% csrf_token %}

                    <div class="rc-field">
                        <label for="email" class="rc-field-label">Email</label>
                        <div class="rc-input-row">
                            <input id="email" name="email" type="email" class="rc-input" placeholder="Enter your email" required>
                            <svg class="rc-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/>
                                <path d="m22 6-10 7L2 6"/>
                            </svg>
                        </div>
                    </div>

                    <div class="rc-field">
                        <label for="password" class="rc-field-label">Password</label>
                        <div class="rc-input-row">
                            <input id="password" name="password" type="password" class="rc-input" placeholder="Enter your password" required>
                            <svg class="rc-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                    </div>

                    <button type="submit" class="rc-login-btn">Login</button>
                </form>

               
            </div>
        </div>

    </section>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

:root {
    --c0:#caf0f8; --c1:#ade8f4; --c2:#90e0ef; --c3:#48cae4;
    --c4:#00b4d8; --c5:#0096c7; --c6:#0077b6; --c7:#023e8a;
    --c8:#03045e; --c9:#02033a;
}

.rc-login-wrap {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem;
    background: linear-gradient(160deg, var(--c0) 0%, var(--c1) 100%);
    font-family: 'Poppins', sans-serif;
}

.rc-login-card {
    width: 100%;
    max-width: 960px;
    min-height: 560px;
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    border-radius: 28px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 30px 60px -20px rgba(2, 3, 58, 0.35);
}

@media (max-width: 780px) {
    .rc-login-card {
        grid-template-columns: 1fr;
    }
}

/* ---------- LEFT PANEL ---------- */
.rc-login-left {
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, var(--c8) 0%, var(--c7) 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.5rem 2rem 1.5rem;
    min-height: 520px;
}

.rc-diagonal-shape {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--c4) 0%, var(--c3) 100%);
    opacity: 0.55;
    clip-path: polygon(38% 0%, 100% 0%, 68% 100%, 0% 100%);
}

.rc-welcome-text {
    position: relative;
    z-index: 1;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    align-self: flex-start;
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--c0);
    text-transform: uppercase;
}

.rc-illustration-img {
    position: absolute;
    z-index: 0;
    top: 8rem;
    left: 54%;
    transform: translateX(-50%);
    width: 110%;
    max-width: 110%;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 20px 25px rgba(2, 3, 58, 0.45));
}

.rc-left-caption {
    position: relative;
    z-index: 2;
    color: rgba(202, 240, 248, 0.85);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0;
    align-self: flex-end;
}

@media (max-width: 780px) {
    .rc-login-left { min-height: 260px; }
    .rc-illustration-img { width: 100%; bottom: 1.5rem; }
}

/* ---------- RIGHT PANEL ---------- */
.rc-login-right {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 2.5rem;
}

.rc-form-wrap {
    width: 100%;
    max-width: 340px;
}

.rc-login-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--c6);
    text-align: center;
    letter-spacing: 0.02em;
    margin-bottom: 2rem;
}

.rc-error-box {
    border: 1px solid #fecdd3;
    background: #fff1f2;
    color: #be123c;
    font-size: 0.85rem;
    border-radius: 12px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
}

.rc-login-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.rc-field-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--c7);
    text-transform: capitalize;
    margin-bottom: 0.4rem;
}

.rc-input-row {
    position: relative;
    display: flex;
    align-items: center;
}

.rc-input {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--c1);
    background: transparent;
    padding: 0.4rem 1.75rem 0.6rem 0.1rem;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    color: var(--c9);
    outline: none;
    transition: border-color 0.2s ease;
}

.rc-input::placeholder {
    color: #a9c3d6;
    font-weight: 300;
}

.rc-input:focus {
    border-bottom-color: var(--c5);
}

.rc-input-icon {
    position: absolute;
    right: 0;
    width: 18px;
    height: 18px;
    color: var(--c5);
    pointer-events: none;
}

.rc-login-btn {
    margin-top: 0.5rem;
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 0.85rem 1rem;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg, var(--c5) 0%, var(--c6) 100%);
    box-shadow: 0 12px 24px -8px rgba(0, 119, 182, 0.55);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.rc-login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 16px 28px -8px rgba(0, 119, 182, 0.6);
}

.rc-login-links {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
    margin-top: 1.25rem;
}

.rc-login-links a {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--c6);
    text-decoration: none;
}

.rc-login-links a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
